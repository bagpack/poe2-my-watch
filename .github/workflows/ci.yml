name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test and package in Dev Container
        if: ${{ !env.ACT }}
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: |
            actionlint
            npm test
            npm run syntaxcheck
            npm run package:extension

      - name: Test and package in act runner
        if: ${{ env.ACT }}
        run: |
          npm test
          npm run syntaxcheck
          npm run package:extension

      - name: Upload packaged extension
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: poe2-my-watch-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
